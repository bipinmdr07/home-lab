server:
  interface: 0.0.0.0
  port: 53
  username: "_unbound"
  directory: "/opt/unbound/etc/unbound"
  chroot: "/opt/unbound/etc/unbound"
  do-daemonize: no

  do-ip4: yes
  # Host IPv6 is only link-local with a broken default route, so don't send
  # queries out over it.
  do-ip6: no
  prefer-ip6: no
  do-udp: yes
  do-tcp: yes

  num-threads: 3
  so-reuseport: yes
  msg-cache-size: 128m
  rrset-cache-size: 256m
  msg-cache-slabs: 4
  rrset-cache-slabs: 4
  key-cache-slabs: 4
  infra-cache-slabs: 4
  outgoing-range: 4096
  num-queries-per-thread: 2048
  incoming-num-tcp: 10
  edns-buffer-size: 1232
  minimal-responses: yes
  prefetch: yes
  prefetch-key: yes
  serve-expired: yes
  aggressive-nsec: yes
  rrset-roundrobin: yes
  qname-minimisation: yes

  cache-min-ttl: 300
  cache-max-ttl: 86400

  access-control: 127.0.0.0/8 allow
  access-control: 172.16.0.0/12 allow
  access-control: 192.168.0.0/16 allow
  access-control: 10.0.0.0/8 allow

  hide-identity: yes
  hide-version: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-below-nxdomain: yes
  harden-short-bufsize: yes
  # These two are experimental and are a common source of random SERVFAILs.
  harden-referral-path: no
  use-caps-for-id: no
  harden-algo-downgrade: no
  deny-any: yes
  val-clean-additional: yes
  unwanted-reply-threshold: 10000
  auto-trust-anchor-file: "var/root.key"
  tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16

  # Log to stderr so `docker logs unbound` actually shows failures.
  verbosity: 1
  log-servfail: yes

include: /opt/unbound/etc/unbound/a-records.conf
include: /opt/unbound/etc/unbound/srv-records.conf

remote-control:
  control-enable: no
