# App data under ${DATA_PATH}/grimmory; optional BookDrop and /books mounts match upstream compose.
services:
  grimmory:
    image: grimmory/grimmory:latest
    container_name: grimmory
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "6060:6060"
    volumes:
      - ${DATA_PATH}/grimmory:/app/data
      - shared_data:/mnt/shared
      - ${DATA_PATH}/grimmory/books:/books
      - ${DATA_PATH}/grimmory/bookdrop:/bookdrop
    # Tomcat/Spring use /tmp under the container overlay. If the host filesystem
    # that backs Docker (often /) is full, startup fails in a tight restart loop
    # and burns CPU. tmpfs keeps temp on RAM instead of that full disk.
    tmpfs:
      - /tmp:rw,size=1024m
    environment:
      - USER_ID=${PUID:-1000}
      - GROUP_ID=${PGID:-1000}
      - TZ=${TZ}
      - DATABASE_URL=jdbc:mariadb://mariadb:3306/grimmory
      - DATABASE_USERNAME=${DB_USER}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - SWAGGER_ENABLED=false
    healthcheck:
      test: wget -q -O - http://localhost:6060/api/v1/healthcheck
      interval: 60s
      retries: 5
      start_period: 60s
      timeout: 10s
    labels:
      - caddy=grimmory.${DOMAIN:-orangepi2.box}
      - caddy.tls=internal
      - caddy.reverse_proxy={{upstreams 6060}}
      - homepage.group=Media
      - homepage.name=Grimmory
      - homepage.icon=mdi-bookshelf
      - homepage.href=https://grimmory.${DOMAIN:-orangepi2.box}
      - homepage.description=Ebook library
